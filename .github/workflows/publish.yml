name: Publish approved release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.2
          persist-credentials: false
      - name: Confirm approved release target
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse 'v1.0.2^{commit}')"
          test "$(cat VERSION)" = 1.0.2
          test "$(gh release view v1.0.2 --json isDraft --jq .isDraft)" = true
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 binutils libsdl2-2.0-0 libfreetype6
      - uses: actions/cache@v4
        with:
          path: .deps/cache
          key: trimui-dependencies-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.py') }}
      - name: Build, test and audit approved source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          cat > /tmp/drivebrowser-build.sh <<'BUILD'
          set -eu
          make deps
          make arm64 native
          make test test-fallback test-arm64 test-input test-input-arm64
          make test-ui test-ui-arm64 smoke-native smoke-arm64
          make package
          python3 scripts/verify_package.py
          python3 scripts/check_docs.py
          BUILD
          if ! bash /tmp/drivebrowser-build.sh > build/release.log 2>&1; then
            tail -n 80 build/release.log
            python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(Path('build/release.log').read_text(errors='replace').splitlines()[-50:])
          print('::error title=Release build diagnostics::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
            exit 1
          fi
          tail -n 30 build/release.log
      - name: Upload and verify release assets
        run: |
          gh release upload v1.0.2 dist/DriveBrowser-1.0.2-arm64.zip dist/DriveBrowser-1.0.2-arm64.zip.sha256
          mkdir -p build/download-verify
          gh release download v1.0.2 --dir build/download-verify --pattern 'DriveBrowser-1.0.2-arm64.zip*'
          cd build/download-verify
          sha256sum -c DriveBrowser-1.0.2-arm64.zip.sha256
          cmp DriveBrowser-1.0.2-arm64.zip ../../dist/DriveBrowser-1.0.2-arm64.zip
      - name: Publish verified release
        run: |
          test "$(gh release view v1.0.2 --json assets --jq '.assets | length')" = 2
          gh release edit v1.0.2 --draft=false --latest
          gh release view v1.0.2 --json url,isDraft,assets
